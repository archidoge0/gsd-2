name: GHAV GSD 263 Rust cache core

on:
  push:
    branches:
      - 'codex/ghav-gsd263-*'

permissions:
  contents: read

jobs:
  build:
    name: Build darwin-arm64
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch snapshot
        with:
          toolchain: '1.98.1'
          targets: aarch64-apple-darwin

      - name: Versions and tree
        run: |
          rustc --version
          cargo --version
          printf 'GHAV_TASK_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"

      - name: Build native addon
        working-directory: native/crates/engine
        env:
          CARGO_ENCODED_RUSTFLAGS: ''
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp native/target/aarch64-apple-darwin/release/libgsd_engine.dylib artifacts/gsd_engine.node 2>/dev/null || \
          cp native/target/aarch64-apple-darwin/release/libgsd_engine.so artifacts/gsd_engine.node 2>/dev/null || \
          { echo '::error::No library found for darwin-arm64'; exit 1; }
          ls -la artifacts/

      - name: Artifact witness
        run: |
          shasum -a 256 artifacts/gsd_engine.node | awk '{print "GHAV_ARTIFACT_SHA256=" $1}'
          stat -f 'GHAV_ARTIFACT_BYTES=%z' artifacts/gsd_engine.node

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-darwin-arm64
          path: artifacts/gsd_engine.node
          if-no-files-found: error
