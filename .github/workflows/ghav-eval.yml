name: GHAV GSD 4093 trace v2 (before)
on:
  push:
    branches:
      - 'ghav/gsd2-4093-trace2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 300
    runs-on: ubuntu-24.04
    env:
      UV_USE_IO_URING: "0"
      GHAV_TRACE_DIR: /home/runner/ghav-trace
      GHAV_TRACE_NOSUDO: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install strace (ghav trace)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          strace -V | head -1

      - name: Install dependencies
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        env:
          GHAV_STEP: install
        run: npm ci

      - name: Install web host dependencies
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        env:
          GHAV_STEP: web-install
        run: npm --prefix web ci

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'web/hooks/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        env:
          GHAV_STEP: build
        run: npm run build

      - name: Build web host
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        env:
          GHAV_STEP: build-web-host
        run: npm run build:web-host

      - name: Typecheck extensions
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        env:
          GHAV_STEP: typecheck
        run: npm run typecheck:extensions

      - name: Validate package is installable
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        env:
          GHAV_STEP: validate-pack
        run: npm run validate-pack

      - name: Run unit tests
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        env:
          GHAV_STEP: unit
        run: npm run test:unit

      - name: Run package tests
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        env:
          GHAV_STEP: packages
        run: npm run test:packages

      - name: Run integration tests
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        timeout-minutes: 75
        continue-on-error: true
        env:
          GHAV_STEP: integration
        run: npm run test:integration

      - name: Check test coverage thresholds
        shell: bash /home/runner/work/gsd-2/gsd-2/.github/ghav/trace-shell.sh {0}
        timeout-minutes: 120
        continue-on-error: true
        env:
          GHAV_STEP: coverage
        run: npm run test:coverage

      - name: Summarize traces (ghav)
        if: always()
        run: python3 .github/ghav/summarize.py /home/runner/ghav-trace-summary.json.gz

      - name: Pack raw traces (ghav)
        if: always()
        run: |
          sudo chown -R "$(id -un)" /home/runner/ghav-trace || true
          tar -C /home/runner -czf /home/runner/ghav-trace-raw.tar.gz ghav-trace
          ls -la /home/runner/ghav-trace-raw.tar.gz /home/runner/ghav-trace-summary.json.gz

      - name: Upload trace summary (ghav)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghav-trace-summary
          path: /home/runner/ghav-trace-summary.json.gz
          retention-days: 30

      - name: Upload raw traces (ghav)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghav-trace-raw
          path: /home/runner/ghav-trace-raw.tar.gz
          retention-days: 7
