name: ghav trace seccomp-root test
"on":
  push:
    branches:
      - ghav/test-trace-priv3
jobs:
  t:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sub/dir
    env:
      TMPDIR: /tmp/custom-tmp
      LD_LIBRARY_PATH: /opt/fake-lib
      GHAV_TRACE_DIR: /home/runner/ghav-trace
      UV_USE_IO_URING: "0"
    steps:
      - name: Install ghav tracer
        working-directory: /home/runner
        run: |-
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq strace
          mkdir -p $HOME/ghav-bin
          echo '' | base64 -d > $HOME/ghav-bin/trace-shell.sh
          echo '' | base64 -d > $HOME/ghav-bin/finalize.sh
          echo '' | base64 -d > $HOME/ghav-bin/step_digest.py
          echo '' | base64 -d > $HOME/ghav-bin/summarize.py
          chmod +x $HOME/ghav-bin/*
          sudo install -o root -g root -m 4755 "$(command -v strace)" $HOME/ghav-bin/strace-root
      - uses: actions/checkout@v4
      - name: mkdir
        working-directory: .
        run: mkdir -p sub/dir /tmp/custom-tmp
        shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
        env:
          GHAV_STEP: 01-mkdir
      - name: sudo deep
        run: |-
          printf 'sudo -n true && echo SUDO_DEEP_OK\n' > x.sh && bash x.sh
          id -un
          grep NoNewPrivs /proc/self/status
        shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
        env:
          GHAV_STEP: 02-sudo_deep
      - name: env kept
        run: |-
          echo TMPDIR=$TMPDIR LD_LIBRARY_PATH=$LD_LIBRARY_PATH
          touch $TMPDIR/marker && echo TMP_OK
        shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
        env:
          GHAV_STEP: 03-env_kept
      - name: modes
        run: cat $HOME/ghav-trace/*/mode
        shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
        env:
          GHAV_STEP: 04-modes
      - name: ghav finalize
        if: always()
        continue-on-error: true
        working-directory: /home/runner
        run: bash $HOME/ghav-bin/finalize.sh
      - name: ghav summarize
        if: always()
        continue-on-error: true
        working-directory: /home/runner
        run: mkdir -p /home/runner/ghav-trace && python3 $HOME/ghav-bin/summarize.py $HOME/ghav-trace-summary.json.gz
      - name: ghav upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ghav-trace-t-${{ strategy.job-index }}
          path: /home/runner/ghav-trace-summary.json.gz
          retention-days: 30
    timeout-minutes: 180
