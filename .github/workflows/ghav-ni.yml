name: 'ghav ni: CI'
'on':
  push:
    branches:
    - ghav/dev/4093-ni
jobs:
  ni-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - name: 'ghav ni: install'
      run: |-
        set -e
        mkdir -p $HOME/ghav-bin $HOME/ghav-ni
        echo '' | base64 -d > $HOME/ghav-bin/ni.py
        echo '' | base64 -d > $HOME/ghav-bin/fsdelta.py
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Install web host dependencies
      run: npm --prefix web ci
    - name: Cache Next.js build
      uses: actions/cache@v4
      with:
        path: web/.next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'web/hooks/**') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
          nextjs-${{ runner.os }}-
    - name: Build
      run: npm run build
    - name: Build web host
      run: npm run build:web-host
    - name: Typecheck extensions
      run: npm run typecheck:extensions
    - name: Validate package is installable
      run: npm run validate-pack
    - name: 'ghav ni: pre unit'
      run: python3 $HOME/ghav-bin/fsdelta.py pre unit
    - name: Run unit tests
      run: npm run test:unit
    - name: 'ghav ni: post unit'
      run: python3 $HOME/ghav-bin/fsdelta.py post unit
    - name: Run package tests
      run: npm run test:packages
    - name: 'ghav ni: pre integration'
      run: python3 $HOME/ghav-bin/fsdelta.py pre integration
    - name: Run integration tests
      run: npm run test:integration
    - name: 'ghav ni: post integration'
      run: python3 $HOME/ghav-bin/fsdelta.py post integration
    - name: 'ghav ni: snapshot scene'
      run: |-
        python3 $HOME/ghav-bin/ni.py snapshot --out $HOME/ghav-ni
        python3 $HOME/ghav-bin/fsdelta.py ops integration unit --out $HOME/ghav-ni/vprime.ops.json
    - name: 'ghav ni: coverage A1 (v)'
      env:
        GHAV_CMD: npm run test:coverage
      run: python3 $HOME/ghav-bin/ni.py run --dir $HOME/ghav-ni --label A1 --value v --cmd "$GHAV_CMD" --cwd "$PWD"
    - name: 'ghav ni: coverage B1 (vprime)'
      env:
        GHAV_CMD: npm run test:coverage
      run: python3 $HOME/ghav-bin/ni.py run --dir $HOME/ghav-ni --label B1 --value vprime --cmd "$GHAV_CMD" --cwd "$PWD"
    - name: 'ghav ni: coverage B2 (vprime)'
      env:
        GHAV_CMD: npm run test:coverage
      run: python3 $HOME/ghav-bin/ni.py run --dir $HOME/ghav-ni --label B2 --value vprime --cmd "$GHAV_CMD" --cwd "$PWD"
    - name: 'ghav ni: coverage A2 (v)'
      env:
        GHAV_CMD: npm run test:coverage
      run: python3 $HOME/ghav-bin/ni.py run --dir $HOME/ghav-ni --label A2 --value v --cmd "$GHAV_CMD" --cwd "$PWD"
    - name: 'ghav ni: verdict'
      if: always()
      run: python3 $HOME/ghav-bin/ni.py verdict --dir $HOME/ghav-ni
    - name: 'ghav ni: upload'
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ghav-ni-coverage
        path: |-
          ~/ghav-ni/runs
          ~/ghav-ni/verdict.json
          ~/ghav-ni/vprime.ops.json
        retention-days: 30
