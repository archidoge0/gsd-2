name: 'ghav trace: ghav before: CI'
'on':
  push:
    branches:
    - ghav/dev/4093-trace
jobs:
  build:
    timeout-minutes: 180
    runs-on: ubuntu-latest
    steps:
    - name: Install ghav tracer
      run: |-
        set -e
        sudo apt-get update -qq && sudo apt-get install -y -qq strace
        mkdir -p $HOME/ghav-bin
        echo '' | base64 -d > $HOME/ghav-bin/trace-shell.sh
        echo '' | base64 -d > $HOME/ghav-bin/finalize.sh
        echo '' | base64 -d > $HOME/ghav-bin/step_digest.py
        echo '' | base64 -d > $HOME/ghav-bin/summarize.py
        chmod +x $HOME/ghav-bin/*
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      run: npm ci
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 02-Install_dependencies
    - name: Install web host dependencies
      run: npm --prefix web ci
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 03-Install_web_host_dependencies
    - name: Cache Next.js build
      uses: actions/cache@v4
      with:
        path: web/.next/cache
        key: nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/components/**', 'web/lib/**', 'web/hooks/**') }}
        restore-keys: |
          nextjs-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
          nextjs-${{ runner.os }}-
    - name: Build
      run: npm run build
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 05-Build
    - name: Build web host
      run: npm run build:web-host
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 06-Build_web_host
    - name: Typecheck extensions
      run: npm run typecheck:extensions
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 07-Typecheck_extensions
    - name: Validate package is installable
      run: npm run validate-pack
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 08-Validate_package_is_installable
    - name: Run unit tests
      run: npm run test:unit
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 09-Run_unit_tests
    - name: Run package tests
      run: npm run test:packages
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 10-Run_package_tests
    - name: Run integration tests
      run: npm run test:integration
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 11-Run_integration_tests
    - name: Check test coverage thresholds
      run: npm run test:coverage
      shell: bash /home/runner/ghav-bin/trace-shell.sh {0}
      env:
        GHAV_STEP: 12-Check_test_coverage_thresholds
    - name: ghav finalize
      if: always()
      run: bash $HOME/ghav-bin/finalize.sh
    - name: ghav summarize
      if: always()
      run: python3 $HOME/ghav-bin/summarize.py $HOME/ghav-trace-summary.json.gz
    - name: ghav upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ghav-trace-build
        path: /home/runner/ghav-trace-summary.json.gz
        retention-days: 30
    env:
      GHAV_TRACE_DIR: /home/runner/ghav-trace
      UV_USE_IO_URING: '0'
