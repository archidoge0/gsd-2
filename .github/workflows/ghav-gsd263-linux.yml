name: GHAV GSD 263 Linux ours
on:
  push:
    branches:
      - codex/ghav-gsd263-linux-ours
permissions:
  contents: read
  actions: write
jobs:
  build:
    name: Build linux-x64-gnu
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_ENCODED_RUSTFLAGS: ''
    steps:
      - name: Checkout fixed task source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8a5dcc89bf399603e30859427e9e3bcdff4da81f
      - name: Install fixed Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu
      - name: Fixed source and toolchain
        run: |
          git rev-parse HEAD
          sha256sum native/Cargo.lock
          rustc --version
          cargo --version
      - name: Build native addon
        working-directory: native/crates/engine
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Prepare and hash native artifact
        run: |
          mkdir -p artifacts
          cp native/target/x86_64-unknown-linux-gnu/release/libgsd_engine.so artifacts/gsd_engine.node
          sha256sum artifacts/gsd_engine.node
          wc -c artifacts/gsd_engine.node
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-linux-x64-gnu
          path: artifacts/gsd_engine.node
          if-no-files-found: error
